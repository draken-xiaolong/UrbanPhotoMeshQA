<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UrbanPhotoMeshQA · 质量审阅</title><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<header><div class="brand">U<span>Q</span></div><div><h1>城市 Mesh 质量审阅</h1><small id="building">正在连接本地资产…</small></div><div class="progress"><strong id="count">0 / 50</strong><span>已评分</span><progress id="progress" max="50" value="0"></progress></div><a class="button" href="/api/export" download="quality_scores.csv">导出评分 CSV ↗</a></header>
<main><aside><div class="side-head"><strong>审阅队列</strong><span>50 个版本</span></div><input id="search" placeholder="搜索退化名称…" aria-label="搜索退化名称"><select id="filter" aria-label="筛选"><option value="all">全部样本</option><option value="pending">尚未评分</option><option value="uncertain">待复核</option></select><div id="list"></div><footer>评分直接保存在本地硬盘。<br>不根据文件名预设质量档位。</footer></aside>
<section class="workspace"><div class="toolbar"><div><strong id="title">载入中</strong><span id="position"></span></div><div class="tools"><button id="reset">重置视角</button><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="top">俯视</button><button id="wire">线框</button><button id="reference">隐藏参考</button></div></div>
<div id="viewers"><div class="viewer" id="left"><div class="view-label"><span class="dot"></span>参考 Clean <small>同一建筑</small></div><div class="canvas" id="canvas-left"></div></div><div class="viewer" id="right"><div class="view-label"><span class="dot blue"></span>待评模型 <small id="model-state">准备加载</small></div><div class="canvas" id="canvas-right"></div></div><div id="loading">正在载入模型与贴图…</div></div>
<div class="hint">拖动旋转 · 滚轮缩放 · 右键平移 <span>两侧视角实时同步</span></div>
<section class="rating"><div class="rating-heading"><div><h2>这个模型的整体质量如何？</h2><p>按实际观感评分；生成强度不等于质量档位。</p></div><span id="save-state" role="status">尚未评分</span></div><div id="grades"><button data-grade="1"><b>1</b><strong>很差</strong><small>严重损坏，基本不可用</small></button><button data-grade="2"><b>2</b><strong>较差</strong><small>明显影响正常使用</small></button><button data-grade="3"><b>3</b><strong>一般</strong><small>缺陷明显，仍可辨认</small></button><button data-grade="4"><b>4</b><strong>良好</strong><small>轻微缺陷，可以接受</small></button><button data-grade="5"><b>5</b><strong>优秀</strong><small>正常观看无明显缺陷</small></button></div><div class="annotation"><input id="note" placeholder="可选备注：哪个位置、什么问题、档位边界…" aria-label="评分备注"><label><input type="checkbox" id="uncertain"> 待复核</label><label><input type="checkbox" id="auto"> 评分后自动下一项</label></div><div class="navigation"><span>快捷键 <kbd>1</kbd>—<kbd>5</kbd> 评分 · <kbd>←</kbd><kbd>→</kbd> 切换 · <kbd>R</kbd> 重置 · <kbd>C</kbd> 参考开关</span><button id="previous">← 上一个</button><button id="next">下一个 →</button></div></section></section></main><script type="module" src="/app.js"></script></body></html>
