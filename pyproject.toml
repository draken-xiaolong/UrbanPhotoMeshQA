[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-photo-mesh-qa"
version = "0.1.0"
description = "No-reference global and local quality assessment for urban photogrammetric glTF meshes"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
]

[project.optional-dependencies]
train = ["torch>=2.2", "tqdm>=4.66"]
mesh = ["trimesh>=4.12", "fast-simplification>=0.2"]
vision = ["opencv-python-headless>=4.10"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
